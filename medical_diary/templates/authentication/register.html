<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register &mdash; Medical History Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include "top-bar.html" %}

    <section class="form-page auth-page">
        <div class="form-card auth-card">
            <div class="auth-heading">
                <h1>Create your account</h1>
                <p class="sub">Your history stays private and secure.</p>
            </div>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('authentication_bp.register') }}">
                <div class="form-row">
                    <label for="full_name">Full name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ full_name|default('') }}" placeholder="Alex Morgan" autocomplete="name">
                </div>
                <div class="form-row">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ username|default('') }}" placeholder="alexmorgan" autocomplete="username" required autofocus>
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter a password" autocomplete="new-password" required>
                </div>
                <div class="form-row">
                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-full">Create account</button>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="{{ url_for('authentication_bp.login') }}">Log in</a>
            </p>
        </div>
    </section>

    {% include "footer.html" %}
</body>
</html>
