<header class="top-bar">
    <a class="brand" href="{{ url_for('home_bp.home') }}">Medical History Diary</a>

    {% if session.get('username') %}
    <a class="add-record-btn" href="{{ url_for('records_bp.records') }}#add-record">+ Add New Record</a>
    <a class="profile-link" href="{{ url_for('profile_bp.profile') }}">
        <span class="profile-icon" aria-hidden="true">&#9679;</span>
        <span>{{ session.get('username') }}</span>
    </a>
    {% else %}
    <a class="profile-link" href="{{ url_for('authentication_bp.login') }}">Log In</a>
    {% endif %}
</header>
