{% extends "layout.html" %}

{% block title %}Music Library{% endblock %}

{% block content %}
<section class="hero">
    <!-- Decorative elements -->

    <div class="hero-content">
        <p class="hero-kicker">
            Your music catalogue · 2026
        </p>
        <h1 class="hero-title">
            Music<br>Library
        </h1>

        <p class="hero-description">Browse and discover music tracks.</p>
    </div>


    <!-- Decorative vinyl -->
    <div class="vinyl">
        <div class="vinyl-disc"></div>
        <div class="vinyl-label">
            <a href="{{ url_for('tracks.browse') }}" class="brush-button">
                <span>
                    Start Browsing
                </span>
            </a>
        </div>
    </div>

</section>
{% endblock %}
