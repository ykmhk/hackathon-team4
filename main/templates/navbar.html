<nav class="navbar" aria-label="Main navigation">
    <a href="{{ url_for('home.home') }}" class="logo">Starter App</a>

    <div class="nav-center">
        <a href="{{ url_for('home.home') }}" class="nav-link">
            <span>01</span> Home.
        </a>
        <a href="{{ url_for('home.home') }}" class="nav-link">
            <span>02</span> Features.
        </a>
        <a href="{{ url_for('authentication.login') }}" class="nav-link">
            <span>03</span> Account.
        </a>
    </div>

    <div class="nav-actions">
        {% if session.get("username") %}
            <span class="nav-user">Signed in as: {{ session["username"] }}</span>

            <form
                class="nav-logout-form"
                action="{{ url_for('authentication.logout') }}"
                method="post"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="primary-button nav-logout-button" type="submit">Log out</button>
            </form>
        {% else %}
            <a class="nav-account-link" href="{{ url_for('authentication.register') }}">
                Register
            </a>
            <a class="nav-account-link" href="{{ url_for('authentication.login') }}">
                Log in
            </a>
        {% endif %}

    </div>
</nav>
