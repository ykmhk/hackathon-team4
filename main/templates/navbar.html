<nav class="navbar" aria-label="Main navigation">
    <a href="{{ url_for('home.home') }}" class="logo">Music Library</a>

    <div class="nav-center">
        <a href="{{ url_for('home.home') }}" class="nav-link">
            <span>01</span> Home.
        </a>
        <a href="{{ url_for('tracks.browse') }}" class="nav-link">
            <span>02</span> Browse.
        </a>
        <a href="{{ url_for('favourites_bp.favourites') }}" class="nav-link">
            <span>03</span> Favourites.
        </a>
    </div>

    {% if request.endpoint != "home.home" %}
        <form class="nav-search" method="get" action="{{ url_for('tracks.search') }}">
            <input
                class="nav-search-input"
                type="search"
                name="query"
                placeholder="Search tracks..."
                aria-label="Search tracks"
                value="{{ request.args.get('query', '') }}"
                required
            >

            <select class="nav-search-select" name="criterion" aria-label="Search by">
                <option
                    value="title"
                    {% if request.args.get("criterion", "title") == "title" %}selected{% endif %}
                >
                    Title
                </option>
                <option
                    value="artist"
                    {% if request.args.get("criterion") == "artist" %}selected{% endif %}
                >
                    Artist
                </option>
                <option
                    value="album"
                    {% if request.args.get("criterion") == "album" %}selected{% endif %}
                >
                    Album
                </option>
                <option
                    value="genre"
                    {% if request.args.get("criterion") == "genre" %}selected{% endif %}
                >
                    Genre
                </option>
            </select>

            <button type="submit" class="nav-search-button">Search</button>
        </form>
    {% endif %}

    <div class="nav-actions">
        {% if session.get("username") %}
            <span class="nav-user">Signed in as: {{ session["username"] }}</span>

            <form
                class="nav-logout-form"
                action="{{ url_for('authentication.logout') }}"
                method="post"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="primary-button nav-logout-button" type="submit">Log out</button>
            </form>
        {% else %}
            <a class="nav-account-link" href="{{ url_for('authentication.register') }}">
                Register
            </a>
            <a class="nav-account-link" href="{{ url_for('authentication.login') }}">
                Log in
            </a>
        {% endif %}

        <button
            type="button"
            class="theme-button"
            id="theme-button"
            onclick="cycleTheme()"
        >
            WHITE GOLD
        </button>
    </div>
</nav>
